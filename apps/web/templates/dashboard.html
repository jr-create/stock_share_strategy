{% extends "base.html" %}

{% block title %}控制台 - Stock Replay{% endblock %}

{% block content %}
<div class="px-4 py-8">
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">欢迎回来, {{ username }}!</h2>
        <p class="text-gray-600 mb-6">管理你的复盘记录和策略</p>
        
        <div class="grid md:grid-cols-3 gap-4">
            <a href="/dashboard/replays/new" class="bg-indigo-600 text-white p-4 rounded-lg hover:bg-indigo-700 text-center">
                发布新复盘
            </a>
            <a href="/dashboard/my-replays" class="bg-white border border-indigo-600 text-indigo-600 p-4 rounded-lg hover:bg-indigo-50 text-center">
                我的复盘
            </a>
            <a href="/dashboard/statistics" class="bg-white border border-indigo-600 text-indigo-600 p-4 rounded-lg hover:bg-indigo-50 text-center">
                统计分析
            </a>
        </div>
    </div>
</div>
{% endblock %}
