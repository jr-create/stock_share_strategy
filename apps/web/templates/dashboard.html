{% extends "base.html" %}

{% block title %}控制台 - Stock Replay{% endblock %}

{% block content %}
<div class="px-4 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 transition-colors">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-6">欢迎回来, {{ username }}!</h2>
        <p class="text-gray-600 dark:text-gray-300 mb-6">管理你的复盘记录和策略</p>
        
        <div class="grid md:grid-cols-3 gap-4">
            <a href="/dashboard/replays/new" class="bg-indigo-600 text-white p-4 rounded-lg hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-center transition-colors">
                发布新复盘
            </a>
            <a href="/dashboard/my-replays" class="bg-white dark:bg-gray-700 border border-indigo-600 dark:border-indigo-400 text-indigo-600 dark:text-indigo-400 p-4 rounded-lg hover:bg-indigo-50 dark:hover:bg-gray-600 text-center transition-colors">
                我的复盘
            </a>
            <a href="/dashboard/statistics" class="bg-white dark:bg-gray-700 border border-indigo-600 dark:border-indigo-400 text-indigo-600 dark:text-indigo-400 p-4 rounded-lg hover:bg-indigo-50 dark:hover:bg-gray-600 text-center transition-colors">
                统计分析
            </a>
        </div>
    </div>
</div>
{% endblock %}
