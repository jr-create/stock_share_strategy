<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stock Replay{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-full flex flex-col">
    <nav class="bg-white shadow-sm border-b flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600">Stock Replay</a>
                    <div class="ml-10 flex space-x-4">
                        <a href="/replays" class="text-gray-600 hover:text-gray-900 px-3 py-2">复盘广场</a>
                        <a href="/market" class="text-gray-600 hover:text-gray-900 px-3 py-2">股票行情</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if logged_in %}
                    <span class="text-gray-600">欢迎, {{ username }}</span>
                    <a href="/logout" class="text-gray-600 hover:text-gray-900">退出</a>
                    {% else %}
                    <a href="/login" class="text-gray-600 hover:text-gray-900">登录</a>
                    <a href="/register" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">注册</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto py-6 sm:px-6 lg:px-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t flex-shrink-0">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">
                © 2026 Stock Replay. 股票复盘记录平台，保留所有权利。
            </p>
        </div>
    </footer>
</body>
</html>
