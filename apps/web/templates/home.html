{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="px-4 py-8">
    <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">股票复盘记录平台</h1>
        <p class="text-xl text-gray-600 mb-8">记录每一笔交易，提升投资水平</p>
        <div class="flex justify-center space-x-4">
            {% if logged_in %}
            <a href="/dashboard" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition">
                进入控制台
            </a>
            {% else %}
            <a href="/register" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition">
                立即开始
            </a>
            {% endif %}
            <a href="/replays" class="bg-white text-indigo-600 border border-indigo-600 px-6 py-3 rounded-lg hover:bg-indigo-50 transition">
                浏览复盘
            </a>
        </div>
    </div>

    <div class="grid md:grid-cols-3 gap-6 mt-12">
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-indigo-600 text-3xl mb-4">📝</div>
            <h3 class="text-lg font-semibold mb-2">每日复盘</h3>
            <p class="text-gray-600">记录每日交易计划、执行情况和复盘总结</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-indigo-600 text-3xl mb-4">📊</div>
            <h3 class="text-lg font-semibold mb-2">策略分析</h3>
            <p class="text-gray-600">追踪策略执行情况，统计胜率和收益</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-indigo-600 text-3xl mb-4">👥</div>
            <h3 class="text-lg font-semibold mb-2">社区分享</h3>
            <p class="text-gray-600">与交易者交流，分享经验和心得</p>
        </div>
    </div>
</div>
{% endblock %}
