{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block head %}
<style>
.hero-gradient {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.stat-card {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
}
.dark .stat-card {
    background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
}
</style>
{% endblock %}

{% block content %}
<div class="px-4">
    <!-- Hero Section -->
    <div class="hero-gradient rounded-2xl p-12 text-center text-white mb-12">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">股票复盘记录平台</h1>
        <p class="text-xl md:text-2xl opacity-90 mb-8">记录每一笔交易，提升投资水平</p>
        <div class="flex justify-center space-x-4">
            {% if logged_in %}
            <a href="/dashboard" class="bg-white text-indigo-600 px-8 py-3 rounded-lg font-semibold hover:bg-gray-100 transition shadow-lg">
                进入控制台
            </a>
            <a href="/replays" class="bg-transparent border-2 border-white text-white px-8 py-3 rounded-lg font-semibold hover:bg-white hover:text-indigo-600 transition">
                浏览复盘广场
            </a>
            {% else %}
            <a href="/register" class="bg-white text-indigo-600 px-8 py-3 rounded-lg font-semibold hover:bg-gray-100 transition shadow-lg">
                立即开始
            </a>
            <a href="/replays" class="bg-transparent border-2 border-white text-white px-8 py-3 rounded-lg font-semibold hover:bg-white hover:text-indigo-600 transition">
                浏览复盘广场
            </a>
            <a href="/login" class="bg-transparent border-2 border-white text-white px-8 py-3 rounded-lg font-semibold hover:bg-white hover:text-indigo-600 transition">
                登录
            </a>
            {% endif %}
        </div>
    </div>

    <!-- Stats Section -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
        <div class="stat-card rounded-lg p-6 text-center">
            <div class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">📈</div>
            <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-2">复盘记录</div>
            <div class="text-gray-600 dark:text-gray-300">系统化管理</div>
        </div>
        <div class="stat-card rounded-lg p-6 text-center">
            <div class="text-3xl font-bold text-green-600 dark:text-green-400">🎯</div>
            <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-2">预测追踪</div>
            <div class="text-gray-600 dark:text-gray-300">验证准确性</div>
        </div>
        <div class="stat-card rounded-lg p-6 text-center">
            <div class="text-3xl font-bold text-purple-600 dark:text-purple-400">📊</div>
            <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-2">数据分析</div>
            <div class="text-gray-600 dark:text-gray-300">可视化统计</div>
        </div>
        <div class="stat-card rounded-lg p-6 text-center">
            <div class="text-3xl font-bold text-orange-600 dark:text-orange-400">👥</div>
            <div class="text-2xl font-bold text-gray-800 dark:text-gray-100 mt-2">社区交流</div>
            <div class="text-gray-600 dark:text-gray-300">经验分享</div>
        </div>
    </div>
</div>
{% endblock %}
