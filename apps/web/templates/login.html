{% extends "base.html" %}

{% block title %}登录 - Stock Replay{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow p-8">
        <h2 class="text-2xl font-bold text-center mb-8">登录账户</h2>
        
        {% if !error.is_empty() %}
        <div class="bg-red-50 text-red-600 p-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-medium mb-2" for="email">
                    邮箱
                </label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2" for="password">
                    密码
                </label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition">
                登录
            </button>
        </form>

        <p class="text-center text-gray-600 mt-6">
            还没有账户？ <a href="/register" class="text-indigo-600 hover:underline">立即注册</a>
        </p>
    </div>
</div>
{% endblock %}
