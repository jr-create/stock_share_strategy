{% extends "base.html" %}

{% block title %}注册 - Stock Replay{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-lg shadow p-8 transition-colors">
        <h2 class="text-2xl font-bold text-center mb-8 text-gray-900 dark:text-gray-100">创建账户</h2>
        
        {% if !error.is_empty() %}
        <div class="bg-red-50 dark:bg-red-900 text-red-600 dark:text-red-300 p-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-4">
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2" for="username">
                    用户名
                </label>
                <input type="text" id="username" name="username" required
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-gray-100 transition-colors"
                    placeholder="3-32个字符，字母数字下划线">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2" for="email">
                    邮箱
                </label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-gray-100 transition-colors">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2" for="password">
                    密码
                </label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-gray-100 transition-colors"
                    placeholder="至少8个字符">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2" for="confirm_password">
                    确认密码
                </label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-gray-100 transition-colors">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 dark:text-gray-300 text-sm font-medium mb-2" for="captcha">
                    验证码
                </label>
                <div class="flex items-center gap-3">
                    <input type="text" id="captcha" name="captcha" required
                        maxlength="6"
                        class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700 dark:text-gray-100 transition-colors"
                        placeholder="请输入验证码">
                    <div class="flex-shrink-0 relative">
                        <div id="captcha-image" class="border border-gray-300 dark:border-gray-600 rounded overflow-hidden cursor-pointer bg-white dark:bg-gray-100" title="点击刷新验证码">
                            {{ captcha_svg|safe }}
                        </div>
                    </div>
                    <button type="button" id="refresh-captcha" 
                        class="flex-shrink-0 p-2 text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition"
                        title="刷新验证码">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 transition">
                注册
            </button>
        </form>

        <p class="text-center text-gray-600 dark:text-gray-300 mt-6">
            已有账户？ <a href="/login" class="text-indigo-600 dark:text-indigo-400 hover:underline">立即登录</a>
        </p>
    </div>
</div>

<script>
// 刷新验证码
function refreshCaptcha() {
    fetch('/captcha')
        .then(response => response.text())
        .then(svg => {
            document.getElementById('captcha-image').innerHTML = svg;
            document.getElementById('captcha').value = '';
        })
        .catch(err => console.error('刷新验证码失败:', err));
}

// 点击验证码图片刷新
document.getElementById('captcha-image').addEventListener('click', refreshCaptcha);

// 点击刷新按钮
document.getElementById('refresh-captcha').addEventListener('click', refreshCaptcha);
</script>
{% endblock %}
